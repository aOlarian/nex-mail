<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable" data-pane="right">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6cbd">
<meta name="referrer" content="no-referrer">
<title>Mail</title>
<link rel="icon" href="/mail/assets/mail-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/mail/assets/mail-themes.css">
<link rel="stylesheet" href="/mail/assets/mail.css">
<link rel="stylesheet" href="/mail/assets/mail-list.css">
<link rel="stylesheet" href="/mail/assets/mail-reader.css">
<link rel="stylesheet" href="/mail/assets/mail-views.css">
<link rel="stylesheet" href="/mail/assets/mail-extra.css">
<script type="module" src="/mail/assets/mail-main.js"></script>
</head>
<body>
<div id="app" class="app welcome" data-view="mail">
  <header class="topbar">
    <button id="btn-menu" class="icon-btn on-top mobile-only" type="button" title="Folders" aria-label="Folders" data-icon="menu"></button>
    <div class="brand-group">
      <div class="brand"><img src="/mail/assets/mail-icon.svg" alt="" width="22" height="22"><span>Mail</span></div>
      <button id="btn-compose" class="btn compose-top" type="button" title="New Email (N)" data-icon="compose"><span>New Email</span></button>
    </div>
    <span class="top-sep" aria-hidden="true"></span>
    <form id="search" class="search" role="search" autocomplete="off">
      <span class="search-ic" data-icon="search" data-size="16"></span>
      <input id="q" type="search" placeholder="Search current folder" aria-label="Search messages" enterkeyhint="search">
      <select id="search-scope" class="search-scope" aria-label="Search scope" title="Search scope">
        <option value="folder">Folder Search</option>
        <option value="mailbox">Mailbox Search</option>
        <option value="inboxes">Search All Inboxes</option>
        <option value="sent">Search All Sent Folders</option>
        <option value="everywhere">Search Everywhere</option>
      </select>
      <button id="search-sent" class="sent-pill" type="button" hidden title="Click to change Sent folder name (recursive)">Sent</button>
      <button id="search-opt" type="button" class="icon-btn sm" title="Search options" aria-label="Search options" data-icon="chevDown" data-size="14"></button>
    </form>
    <span class="top-sep after-search" aria-hidden="true"></span>
    <nav class="rail top-rail" aria-label="Views">
      <button type="button" class="rail-btn on-top" data-view="mail" title="Mail" aria-label="Mail" data-icon="mail"></button>
      <button type="button" class="rail-btn on-top" data-view="calendar" title="Calendar" aria-label="Calendar" data-icon="calendar"></button>
      <button type="button" class="rail-btn on-top" data-view="tasks" title="Tasks" aria-label="Tasks" data-icon="tasks"></button>
    </nav>
    <span class="top-sep" aria-hidden="true"></span>
    <div class="top-actions">
      <button id="btn-rightbar" class="icon-btn on-top" type="button" title="Toggle right sidebar (Calendar & Flagged)" aria-label="Right sidebar" data-icon="panelRight"></button>
      <button id="btn-sync" class="icon-btn on-top" type="button" title="Sync now (F5)" aria-label="Sync now" data-icon="sync"></button>
      <button id="btn-settings" class="icon-btn on-top" type="button" title="Settings & Themes" aria-label="Settings" data-icon="settings"></button>
    </div>
  </header>
  <div class="body">
    <aside id="side" class="side" aria-label="Folders" role="tree"></aside>
    <div class="splitter" data-split="side"></div>
    <main id="main" class="main">
      <div id="mailview" class="mailview">
        <div class="panes">
          <section id="listpane" class="listpane" aria-label="Message list">
            <div class="list-head"></div>
            <div id="list" class="list" role="listbox" aria-multiselectable="true" tabindex="0"></div>
          </section>
          <div class="splitter" data-split="list"></div>
          <section id="reader" class="reader" aria-label="Reading pane"></section>
          <div class="splitter" data-split="right"></div>
          <aside id="rightbar" class="rightbar" aria-label="Calendar and Flagged messages"></aside>
        </div>
      </div>
      <div id="altview" class="altview" hidden></div>
    </main>
  </div>
  <div id="scrim" class="scrim"></div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
